// ===== src/game.js =====
// ============================================================
//  章节流 + 直播逻辑（不碰 DOM，可无头测试）
//  弹幕在屏幕任意位置弹出，各自倒计时；点中哪条就回应哪条
// ============================================================


const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const ACTION_BY_ID = Object.fromEntries(ACTIONS.map((a) => [a.id, a]));

function correctActionIndex(type) {
  const i = ACTIONS.findIndex((a) => a.good.includes(type));
  return i < 0 ? 0 : i;
}

let popupSeq = 1;

function createGame() {
  const g = {
    phase: 'chapter', // chapter | live | summary | ending
    step: 0,
    day: 1,
    chapterId: null,
    chapter: null,
    chapterLine: 0,
    choiceActive: false,
    chosen: false,
    replyLines: null,
    replyIndex: 0,

    mental: MAX.mental,
    health: MAX.health,
    attention: 0,
    dayStart: 0,

    timeLeft: 0,
    duration: 0,
    goal: 0,

    popups: [],
    selected: null,
    spawnTimer: 1.2,
    interference: null,
    interferenceIn: 999,
    takeover: null,
    suppressCd: 0,
    corruptTimer: 0,
    lineGapCur: CONFIG.lineGap,
    interferenceRange: CONFIG.interferenceEvery,
    corruptRange: CONFIG.corruptEvery,
    checkpoint: null,
    retryReason: null,
    sceneIndex: 0,
    sceneLines: CRITICAL_SCENE,
    possession: 0,
    afterglow: 0,
    clock: 0,
    corruptCleared: 0,

    floats: [],
    hits: [],
    flash: 0,
    shake: 0,

    surrenders: 0,
    matched: 0,
    mistimed: 0,
    dropped: 0,
    suppressed: 0,
    suppressedLate: 0,

    summary: null,
    ending: null,
  };
  loadStep(g);
  return g;
}

// ------------------------------------------------------------
//  流程
// ------------------------------------------------------------
function loadStep(g) {
  const s = FLOW[g.step];
  if (!s) return finishRun(g);
  if (s.type === 'chapter') {
    const ch = CHAPTERS[s.id];
    g.phase = 'chapter';
    g.chapterId = s.id;
    g.chapter = ch;
    g.chapterLine = 0;
    g.choiceActive = false;
    g.chosen = false;
    g.replyLines = null;
    g.replyIndex = 0;
    if (ch.day) g.day = ch.day;
  } else {
    startLive(g, s.day);
  }
}

function nextStep(g) {
  g.step += 1;
  if (g.step >= FLOW.length) return finishRun(g);
  const s = FLOW[g.step];
  if (s.type === 'live' && s.day > 1) {
    g.mental = clamp(g.mental + REST.mental, 0, MAX.mental);
    g.health = clamp(g.health + REST.health, 0, MAX.health);
  }
  loadStep(g);
}

function snapshot(g) {
  return {
    day: g.day,
    mental: g.mental,
    health: g.health,
    attention: g.attention,
    surrenders: g.surrenders,
    matched: g.matched,
    mistimed: g.mistimed,
    dropped: g.dropped,
    suppressed: g.suppressed,
    suppressedLate: g.suppressedLate,
    corruptCleared: g.corruptCleared,
  };
}

function startLive(g, day) {
  const cfg = DAYS[day - 1];
  g.checkpoint = snapshot(g); // 进直播间自动存档
  g.lineGapCur = cfg.lineGap || CONFIG.lineGap;
  g.interferenceRange = cfg.interference || CONFIG.interferenceEvery;
  g.corruptRange = cfg.corrupt || CONFIG.corruptEvery;
  g.corruptTimer = rand(...g.corruptRange);
  g.phase = 'live';
  g.day = day;
  g.duration = cfg.duration;
  g.timeLeft = cfg.duration;
  g.goal = cfg.goal;
  g.dayStart = g.attention;
  g.popups = [];
  g.selected = null;
  g.spawnTimer = 1.2;
  g.interference = null;
  g.interferenceIn = rand(...g.interferenceRange);
  g.takeover = null;
  g.suppressCd = 0;
  g.retryReason = null;
  g.possession = 0;
  g.afterglow = 0;
  g.clock = 0;
  g.floats = [];
  g.hits = [];
  g.flash = 0;
  g.shake = 0;
}

function endDay(g) {
  if (g.mental <= 0) return finishRun(g, 'hollow');
  if (g.health <= 0) return finishRun(g, 'collapse');
  g.phase = 'summary';
  g.summary = {
    day: g.day,
    gained: Math.round(g.attention - g.dayStart),
    total: Math.round(g.attention),
    goal: g.goal,
    met: g.attention >= g.goal,
    mental: Math.round(g.mental),
    health: Math.round(g.health),
  };
}

function finishRun(g, forcedKey) {
  g.phase = 'ending';
  let key = forcedKey;
  if (!key) {
    if (g.surrenders >= 3) key = 'curtain';
    else if (g.attention >= CONFIG.winAttention) key = g.mental >= 40 ? 'coexist' : 'imbalance';
    else key = 'nobody';
  }
  g.ending = { key, ...ENDINGS[key] };
}

// ------------------------------------------------------------
//  章节
// ------------------------------------------------------------
function advanceChapter(g) {
  if (g.phase !== 'chapter') return;

  if (g.replyLines) {
    g.replyIndex += 1;
    if (g.replyIndex >= g.replyLines.length) {
      g.replyLines = null;
      g.replyIndex = 0;
      nextStep(g);
    }
    return;
  }

  if (g.choiceActive) return;

  if (g.chapterLine < g.chapter.lines.length - 1) {
    g.chapterLine += 1;
    return;
  }
  if (g.chapter.choice && !g.chosen) {
    g.choiceActive = true;
    return;
  }
  nextStep(g);
}

function chooseOption(g, index) {
  if (g.phase !== 'chapter' || !g.choiceActive) return;
  const opt = g.chapter.choice.options[index];
  if (!opt) return;

  g.mental = clamp(g.mental + (opt.mental || 0), 0, MAX.mental);
  g.health = clamp(g.health + (opt.health || 0), 0, MAX.health);
  g.choiceActive = false;
  g.chosen = true;
  g.replyLines = opt.reply || [];
  g.replyIndex = 0;

  if (g.mental <= 0) return finishRun(g, 'hollow');
  if (g.health <= 0) return finishRun(g, 'collapse');
  if (!g.replyLines.length) nextStep(g);
}

function continueFromSummary(g) {
  if (g.phase !== 'summary') return;
  g.summary = null;
  nextStep(g);
}

// ------------------------------------------------------------
//  直播
// ------------------------------------------------------------
function float(g, text, color, x, y) {
  g.floats.push({ text, color, x, y, life: 1.2, maxLife: 1.2 });
}

// 关注度掉到 0 以下时，多出来的部分转成精神
// hard=true 表示是玩家的失误造成的扣分，扣穿 0 时转成精神；
// 自然流失（hard=false）只把关注度压到 0，不额外扣精神。
function addAttention(g, delta, hard = false) {
  if (delta >= 0) { g.attention += delta; return; }
  const after = g.attention + delta;
  if (after < 0) {
    g.attention = 0;
    if (hard) g.mental += after * 0.5;
  } else {
    g.attention = after;
  }
}

function applyTotals(g) {
  g.attention = clamp(g.attention, 0, MAX.attention);
  g.mental = clamp(g.mental, 0, MAX.mental);
  g.health = clamp(g.health, 0, MAX.health);
}

function checkDeath(g) {
  if (g.phase !== 'live') return true;
  if (g.mental <= 0) { enterRetry(g, 'hollow'); return true; }
  if (g.health <= 0) { enterRetry(g, 'collapse'); return true; }
  return false;
}

function startScene(g) {
  g.phase = 'scene';
  g.sceneIndex = 0;
  g.popups = [];
  g.selected = null;
  g.mental = 0;
}

function advanceScene(g) {
  if (g.phase !== 'scene') return;
  g.sceneIndex += 1;
  // 彩蛋放完直接进结局：这一次不给「重来这一场」
  if (g.sceneIndex >= g.sceneLines.length) finishRun(g, 'hollow');
}

// 直播间里倒下：只回滚这一场，不回到开头
function enterRetry(g, reason) {
  g.phase = 'retry';
  g.retryReason = reason;
  g.popups = [];
  g.selected = null;
  g.interference = null;
}

function retryLevel(g) {
  if (g.phase !== 'retry' || !g.checkpoint) return false;
  const cp = g.checkpoint;
  g.day = cp.day;
  g.mental = cp.mental;
  g.health = cp.health;
  g.attention = cp.attention;
  g.surrenders = cp.surrenders;
  g.matched = cp.matched;
  g.mistimed = cp.mistimed;
  g.dropped = cp.dropped;
  g.suppressed = cp.suppressed;
  g.suppressedLate = cp.suppressedLate;
  g.corruptCleared = cp.corruptCleared;
  g.retryReason = null;
  g.possession = 0;
  g.afterglow = 0;
  g.clock = 0;
  startLive(g, cp.day);
  return true;
}

function giveUp(g) {
  if (g.phase !== 'retry') return false;
  const key = g.retryReason || 'hollow';
  g.retryReason = null;
  g.possession = 0;
  g.afterglow = 0;
  g.clock = 0;
  finishRun(g, key);
  return true;
}

// 当前要回应的那条：优先玩家点选的，否则最急的
function activeBubble(g) {
  if (g.selected != null) {
    const sel = g.popups.find((p) => p.id === g.selected);
    if (sel) return sel;
    g.selected = null;
  }
  if (!g.popups.length) return null;
  return g.popups.reduce((a, b) => (a.timeLeft <= b.timeLeft ? a : b));
}

function selectBubble(g, id) {
  if (g.popups.some((p) => p.id === id)) g.selected = id;
}

function hitPopup(g, x, y) {
  for (let i = g.popups.length - 1; i >= 0; i--) {
    const p = g.popups[i];
    if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p;
  }
  return null;
}

function pickPosition(g, w, h) {
  const top = 104;
  const bottom = 452;
  const maxX = Math.max(8, W - 28 - w);
  const maxY = Math.max(8, bottom - top - h);
  for (let i = 0; i < 16; i++) {
    const x = 14 + Math.random() * maxX;
    const y = top + Math.random() * maxY;
    const clash = g.popups.some(
      (p) => Math.abs(p.x - x) < w * 0.72 && Math.abs(p.y - y) < h * 0.92,
    );
    if (!clash) return { x, y };
  }
  return { x: 14 + Math.random() * maxX, y: top + Math.random() * maxY };
}

function spawnPopup(g) {
  const types = Object.keys(LINES);
  const type = pick(types);
  const text = pick(LINES[type]);
  const w = CONFIG.popupW;
  const h = CONFIG.popupH;
  const pos = pickPosition(g, w, h);

  const popup = {
    id: popupSeq++,
    type,
    text,
    x: pos.x,
    y: pos.y,
    w,
    h,
    timeLeft: CONFIG.lineWindow,
    maxTime: CONFIG.lineWindow,
    age: 0,
    autoTimer: g.possession > 0 ? 0.35 : -1,
    phase: Math.random() * Math.PI * 2,
    corruptIndex: -1,
    corruptText: '',
  };

  g.popups.push(popup);
  if (g.popups.length > CONFIG.maxQueue) {
    const lost = g.popups.shift();
    if (g.selected === lost.id) g.selected = null;
    g.dropped += 1;
    // 被挤掉和漏接同价，否则「什么都不干」反而没有损失
    addAttention(g, -CONFIG.missPenalty.attention * (g.afterglow > 0 ? CONFIG.aftermathPenalty : 1), true);
    g.mental -= CONFIG.missPenalty.mental;
    float(g, '被刷上去了', '#e2695c', 240, 300);
  }
}

function removePopup(g, popup) {
  const i = g.popups.indexOf(popup);
  if (i >= 0) g.popups.splice(i, 1);
  if (g.selected === popup.id) g.selected = null;
  g.spawnTimer = Math.max(g.spawnTimer, 0.3);
}

// 抢麦面板的状态：时间倒计时（timeLeft）和清除进度（prog 0~1）各算各的
function makeInterference(g, opts = {}) {
  const timeLeft = opts.timeLeft ?? CONFIG.interferenceWindow;
  return {
    text: opts.text ?? pick(INTERFERENCE),
    timeLeft,
    maxTime: opts.maxTime ?? timeLeft,
    prog: opts.prog ?? 0,          // 0~1，点一下涨、每秒自己掉
    decay: opts.decay ?? rand(...CONFIG.mashDecay),
    pulse: 0,                       // 每点一下闪一下，纯表现
    punch: 0,                       // 每点一下的「打中」回弹，纯表现
    critical: opts.critical ?? g.mental <= CONFIG.interferencePenalty.mental,
  };
}

function spawnInterference(g) {
  g.interference = makeInterference(g);
  g.shake = 0.4;
}

// 回应不再按出现顺序：谁的「需求类型」被这个动作接住，就处理谁
function pickTarget(g, action) {
  const matches = g.popups.filter((p) => action.good.includes(p.type));
  if (!matches.length) return null;
  const sel = g.selected != null ? matches.find((p) => p.id === g.selected) : null;
  if (sel) return sel;
  return matches.reduce((a, b) => (a.timeLeft <= b.timeLeft ? a : b));
}

// 这个按钮位有没有被戏中人抢占（只有亮出来的才算，避免「看到的是正常按钮」被坑）
function isRevealed(g, popup) {
  if (popup.corruptIndex < 0) return false;
  if (popup.corruptAt === undefined) return true; // 测试/调试直接设的，视为已生效
  const age = g.clock - popup.corruptAt;
  return age >= CONFIG.corruptReveal && age < CONFIG.corruptReveal + CONFIG.corruptWindow;
}

function corruptedSlots(g) {
  const set = new Set();
  for (const p of g.popups) if (isRevealed(g, p)) set.add(p.corruptIndex);
  return set;
}

// 某个按钮位上真正生效的「我来吧。」
function hijackAt(g, index) {
  const popup = g.popups.find(
    (p) => p.corruptIndex === index && isRevealed(g, p),
  );
  return popup || null;
}

function respond(g, actionId) {
  if (g.phase !== 'live' || g.possession > 0) return null;
  const action = ACTION_BY_ID[actionId];
  if (!action) return null;

  if (!g.popups.length) return null; // 屏幕上什么都没有，按了也白按

  const target = pickTarget(g, action);

  // 屏幕上没有能接住的弹幕
  if (!target) {
    if (action.id === 'silent') {
      // 沉默本来就是休息键，空放不算说错话；掉粉也不折成精神
      addAttention(g, action.missPenalty ?? -14, false);
      g.mental += action.mental;
      g.health += action.health;
      g.mistimed += 1;
      float(g, '喘了口气', '#9aa8b8', 240, 300);
    } else {
      addAttention(g, -CONFIG.wrongPenalty.attention * (g.afterglow > 0 ? CONFIG.aftermathPenalty : 1), true);
      g.mental += CONFIG.wrongPenalty.mental;
      g.mistimed += 1;
      float(g, '说错话了', '#e2695c', 240, 300);
    }
    applyTotals(g);
    checkDeath(g);
    return false;
  }

  // 接住了其中一条（同类型有多条，也只处理一条）
  const gain = action.attention * (g.afterglow > 0 ? CONFIG.aftermathGain : 1);
  addAttention(g, gain);
  g.mental += action.mental;
  g.health += action.health;
  g.matched += 1;
  float(g, `+${Math.round(gain)} 关注`, '#8fd18a', target.x + target.w / 2, target.y + 8);

  removePopup(g, target);
  applyTotals(g);
  checkDeath(g);
  return true;
}

// 按下「我来吧。」：关注暴涨，精神暴跌
function letHimSay(g, index) {
  if (g.phase !== 'live' || g.possession > 0) return false;
  const victims = g.popups.filter((p) => p.corruptIndex === index && isRevealed(g, p));
  if (!victims.length) return false;

  const sel = g.selected != null ? victims.find((p) => p.id === g.selected) : null;
  const target = sel || victims.reduce((a, b) => (a.timeLeft <= b.timeLeft ? a : b));

  g.attention += CORRUPT.attention * (g.afterglow > 0 ? CONFIG.aftermathGain : 1);
  g.mental += CORRUPT.mental;
  g.surrenders += 1;
  g.matched += 1;
  g.takeover = { text: target.corruptText, life: 2.6, maxLife: 2.6 };
  g.flash = 0.3;
  g.shake = 0.6;
  float(g, `+${Math.round(CORRUPT.attention * (g.afterglow > 0 ? CONFIG.aftermathGain : 1))} 关注`, '#8fd18a', target.x + target.w / 2, target.y + 8);
  float(g, `精神 ${CORRUPT.mental}`, '#e2695c', target.x + target.w / 2, target.y + 32);

  removePopup(g, target);
  applyTotals(g);
  checkDeath(g);
  return true;
}

// 这个按钮有没有「被抢」
function corruptOwner(g, index) {
  return g.popups.find((p) => p.corruptIndex === index) || null;
}

// 切换：是否有东西可以屏蔽
function canSuppress(g) {
  return !!g.interference || g.popups.some((p) => p.corruptIndex >= 0);
}

// 全屏抢麦：点一下涨一截进度，同时进度自己往下掉。
// 时间没停：倒计时归零时进度没满就进接管（在 update 里结算）。
function mashInterference(g, x, y) {
  if (g.phase !== 'live' || g.possession > 0) return false;
  const it = g.interference;
  if (!it) return false;

  it.prog = Math.min(1, (it.prog || 0) + rand(...CONFIG.mashGain));
  it.pulse = 1;
  it.punch = 1;
  g.shake = Math.max(g.shake, CONFIG.mashShake);
  g.flash = Math.max(g.flash, 0.1);
  if (x != null && y != null) {
    g.hits.push({ x, y, life: 0.26, max: 0.26 });
    if (g.hits.length > 12) g.hits.shift();
  }

  if (it.prog < 1) return false; // 还没压回去，只给了个手感

  // 满了：这就是原来「屏蔽」的那一下就成功的代价
  g.health -= CONFIG.suppressCost.health;
  g.mental += CONFIG.suppressCost.mental;
  g.suppressCd = CONFIG.suppressCd;
  g.corruptTimer = rand(...g.corruptRange);
  g.interference = null;
  g.interferenceIn = rand(...g.interferenceRange);
  g.suppressed += 1;

  g.flash = 0.45;
  g.shake = 0.62;
  float(g, '压回去了', '#7fe0d0', 240, 300);
  applyTotals(g);
  checkDeath(g);
  return true;
}

function suppress(g) {
  if (g.phase !== 'live' || g.possession > 0) return false;
  // 抢麦在的时候，按一下不算数，只算连点里的第一下（且不受屏蔽 CD 限制）
  if (g.interference) return mashInterference(g);

  if (g.suppressCd > 0) return false;
  const cleared = g.popups.filter((p) => p.corruptIndex >= 0);
  if (!cleared.length) return false; // 没东西可屏蔽：不消耗、不进 CD

  g.suppressCd = CONFIG.suppressCd;
  g.corruptTimer = rand(...g.corruptRange);
  g.health -= CONFIG.suppressCost.health;
  g.mental += CONFIG.suppressCost.mental;

  for (const p of cleared) {
    p.corruptIndex = -1;
    p.corruptText = '';
  }
  g.corruptCleared += cleared.length;

  g.flash = 0.22;
  float(g, '按回去了', '#7fe0d0', 240, 300);
  applyTotals(g);
  checkDeath(g);
  return true;
}

// ------------------------------------------------------------
//  每帧
// ------------------------------------------------------------
function update(g, dtRaw) {
  const dt = Math.min(dtRaw, 0.05);

  g.flash = Math.max(0, g.flash - dt);
  g.shake = Math.max(0, g.shake - dt);
  if (g.takeover) {
    g.takeover.life -= dt;
    if (g.takeover.life <= 0) g.takeover = null;
  }
  for (let i = g.floats.length - 1; i >= 0; i--) {
    const f = g.floats[i];
    f.life -= dt;
    f.y -= 26 * dt;
    if (f.life <= 0) g.floats.splice(i, 1);
  }
  for (let i = g.hits.length - 1; i >= 0; i--) {
    g.hits[i].life -= dt;
    if (g.hits[i].life <= 0) g.hits.splice(i, 1);
  }

  if (g.phase !== 'live') return;

  if (g.suppressCd > 0) g.suppressCd = Math.max(0, g.suppressCd - dt);
  if (g.afterglow > 0) g.afterglow = Math.max(0, g.afterglow - dt);
  g.clock += dt;
  g.timeLeft -= dt;
  addAttention(g, -CONFIG.attentionDecay * dt);
  g.mental -= CONFIG.mentalDrain * dt;

  // 弹幕弹出：越接近当天目标，刷得越快
  // 他抢麦的时候刷屏停住：面板把弹幕整个盖住了，看不见的东西不该罚
  if (!g.interference) {
    g.spawnTimer -= dt;
    if (g.spawnTimer <= 0) {
      spawnPopup(g);
      const progress = Math.min(1, g.attention / Math.max(1, g.goal));
      g.spawnTimer = g.lineGapCur * (1 - CONFIG.rushGain * progress);
    }
  }

  // 各自倒计时（抢麦期间冻住，见上）
  for (const p of g.popups) {
    if (!g.interference) p.timeLeft -= dt;
    p.age += dt;
    if (p.autoTimer >= 0) p.autoTimer -= dt;
  }

  // 他接管直播间的这几秒：弹幕全由他完美处理，玩家插不了手
  if (g.possession > 0) {
    const wasPossessed = g.possession;
    g.possession = Math.max(0, g.possession - dt);
    if (wasPossessed > 0 && g.possession === 0) g.afterglow = CONFIG.aftermathTime;
    for (let i = g.popups.length - 1; i >= 0; i--) {
      const p = g.popups[i];
      if (p.autoTimer > 0) continue;
      const action = ACTIONS[correctActionIndex(p.type)];
      addAttention(g, action.attention);
      g.matched += 1;
      float(g, `+${action.attention} 关注`, '#ffd0c8', p.x + p.w / 2, p.y + 8);
      g.popups.splice(i, 1);
      if (g.selected === p.id) g.selected = null;
    }
    applyTotals(g);
    if (g.timeLeft <= 0) endDay(g);
    return;
  }

  let expiredFlag = false;
  for (let i = g.popups.length - 1; i >= 0; i--) {
    const p = g.popups[i];
    if (p.timeLeft > 0) continue;
    g.popups.splice(i, 1);
    if (g.selected === p.id) g.selected = null;
    addAttention(g, -CONFIG.missPenalty.attention * (g.afterglow > 0 ? CONFIG.aftermathPenalty : 1), true);
    g.mental -= CONFIG.missPenalty.mental;
    g.dropped += 1;
    expiredFlag = true;
  }
  if (expiredFlag) float(g, '没接住', '#e2695c', 240, 300);

  // 他抢按钮：屏幕上一个都没有的时候开始倒计时
  const hasCorrupt = g.popups.some((p) => p.corruptIndex >= 0);
  if (!hasCorrupt) {
    g.corruptTimer -= dt;
    if (g.corruptTimer <= 0) {
      if (g.popups.length) {
        const target = pick(g.popups);
        const right = correctActionIndex(target.type);
        target.corruptIndex =
          Math.random() < CORRUPT.biasToCorrect ? right : Math.floor(Math.random() * ACTIONS.length);
        target.corruptText = pick(CORRUPT.lines);
        target.corruptAt = g.clock;
        g.corruptTimer = rand(...g.corruptRange);
      } else {
        g.corruptTimer = 0; // 没弹幕可抢，等下一批
      }
    }
  }

  // 戏中人
  if (g.interference) {
    const it = g.interference;
    if (it.prog == null) it.prog = 0; // 调试/测试直接塞进来的对象
    if (it.decay == null) it.decay = rand(...CONFIG.mashDecay);
    if (it.pulse > 0) it.pulse = Math.max(0, it.pulse - dt * 4);
    if (it.punch > 0) it.punch = Math.max(0, it.punch - dt * 7);
    it.prog = Math.max(0, it.prog - it.decay * dt);
    it.timeLeft -= dt;
    if (it.timeLeft <= 0) {
      const critical = !!g.interference.critical;
      g.mental -= CONFIG.interferencePenalty.mental;
      g.suppressedLate += 1;
      g.flash = 0.6;
      g.shake = 0.5;
      g.interference = null;
      g.interferenceIn = rand(...g.interferenceRange);
      if (critical) {
        startScene(g);
      } else {
        g.possession = CONFIG.possessionTime;
        float(g, '他把这一段接过去了', '#ff6b5b', 240, 300);
      }
    }
  } else {
    g.interferenceIn -= dt;
    if (g.interferenceIn <= 0) spawnInterference(g);
  }

  applyTotals(g);
  if (checkDeath(g)) return;
  if (g.timeLeft <= 0) endDay(g);
}
// ===== src/render.js =====
// ============================================================
//  渲染：480x640 竖屏
// ============================================================


const font = (size, weight = 400) =>
  `${weight} ${size}px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif`;

const LAYOUT = {
  suppress: { x: 404, y: 530, w: 64, h: 64 },
  actions: ACTIONS.map((_, i) => ({ x: 12 + i * 98, y: 530, w: 90, h: 64 })),
  chapterOptions: [0, 1, 2].map((i) => ({ x: 40, y: 402 + i * 64, w: W - 80, h: 54 })),
  retry: { x: 70, y: 396, w: W - 140, h: 66 },
  giveup: { x: 120, y: 492, w: W - 240, h: 44 },
  // 抢麦面板：连点它的任意位置都算一下「压回去」
  interference: { x: 8, y: 122, w: W - 16, h: 318 },
  stageTop: 96,
  stageBottom: 462,
};

const TYPE_TAG = {
  comfort: '倾诉',
  sad: '低落',
  ask: '求助',
  rant: '挑衅',
  spam: '刷屏',
  joke: '要乐子',
  song: '点歌',
  gift: '送礼',
  probe: '试探',
};

function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function wrap(ctx, text, maxW) {
  const out = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW && line) {
      out.push(line);
      line = ch;
    } else line += ch;
  }
  if (line) out.push(line);
  return out;
}

// ------------------------------------------------------------
function draw(g, ctx, ui) {
  // 刚切到结局：先把上一帧（直播/彩蛋）留在离屏画布上，
  // 息屏动画要把它压成一条线
  if (g.phase === 'ending') {
    if (powerPhase !== 'ending') {
      powerDpr = ctx.canvas.width / W;
      powerBuf.width = ctx.canvas.width;
      powerBuf.height = ctx.canvas.height;
      powerCtx.drawImage(ctx.canvas, 0, 0);
      endingBuf.width = ctx.canvas.width;
      endingBuf.height = ctx.canvas.height;
      powerStart = performance.now();
      powerPhase = 'ending';
    }
  } else {
    powerPhase = g.phase;
  }

  ctx.save();
  if (g.phase === 'live' && g.shake > 0) {
    ctx.translate((Math.random() - 0.5) * g.shake * 10, (Math.random() - 0.5) * g.shake * 10);
  }
  // 每点一下，画面整体轻微「顶」一下（和震屏一起构成打击感）
  if (g.phase === 'live' && g.interference && g.interference.punch > 0) {
    const s = 1 + g.interference.punch * 0.012;
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.translate(-W / 2, -H / 2);
  }
  drawBackdrop(ctx);

  if (g.phase === 'scene') {
    drawScene(ctx, g);
  } else if (g.phase === 'retry') {
    drawRetry(ctx, g);
  } else if (g.phase === 'chapter') {
    drawChapter(ctx, g);
  } else if (g.phase === 'summary') {
    drawSummary(ctx, g);
  } else if (g.phase === 'ending') {
    drawEnding(ctx, g);
  } else {
    drawHud(ctx, g);
    drawStage(ctx, g, ui);
    drawControls(ctx, g);
    drawFloats(ctx, g);
    drawHits(ctx, g);
    if (g.flash > 0) {
      ctx.fillStyle = `rgba(255,90,90,${g.flash * 0.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (g.interference && g.interference.critical) drawCriticalFx(ctx);
  }
  ctx.restore();
}

// 通屏故障效果：压暗 + 撕裂 + 扫描线 + 红色噪点。
// 精神见底时用它；彩蛋那两句台词也用同一套，只是参数轻一点。
function drawGlitchFx(ctx, opts = {}) {
  const {
    dim = 0.42,
    red = 0.1,
    scan = 0.2,
    noise = 14,
    slices = 6,
    maxShift = 28,
    label = null,
    labelY = 108,
    avoid = null,
  } = opts;
  const dpr = ctx.canvas.width / W;

  ctx.save();
  if (dim > 0) {
    ctx.fillStyle = `rgba(0,0,0,${dim})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (red > 0) {
    ctx.fillStyle = `rgba(150,0,0,${red})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 撕裂：把若干条横带水平错位
  if (slices > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < slices; i++) {
      const sh = (4 + Math.random() * 26) * dpr;
      let sy = Math.random() * ctx.canvas.height;
      // 有台词的地方躲开：撕裂只发生在空白处，字才读得清
      if (avoid) {
        for (let k = 0; k < 8; k++) {
          const a = avoid.y0 * dpr;
          const b = avoid.y1 * dpr;
          if (!(sy < b && sy + sh > a)) break;
          sy = Math.random() * ctx.canvas.height;
        }
      }
      const dx = (Math.random() - 0.5) * maxShift * dpr;
      ctx.drawImage(ctx.canvas, 0, sy, ctx.canvas.width, sh, dx, sy, ctx.canvas.width, sh);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 扫描线
  if (scan > 0) {
    ctx.fillStyle = `rgba(0,0,0,${scan})`;
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  }

  // 红色噪点
  for (let i = 0; i < noise; i++) {
    ctx.fillStyle = `rgba(255,40,30,${0.06 + Math.random() * 0.12})`;
    ctx.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 26, 1 + Math.random() * 2);
  }
  ctx.restore();

  if (label) {
    ctx.fillStyle = `rgba(255,70,60,${0.6 + 0.4 * Math.sin(performance.now() / 120)})`;
    ctx.font = font(11, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, W / 2, labelY);
  }
}

function drawCriticalFx(ctx) {
  drawGlitchFx(ctx, { label: '精 神 值 见 底' });
}

function drawBackdrop(ctx) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#171020');
  bg.addColorStop(0.55, '#120d18');
  bg.addColorStop(1, '#0d0a12');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------
//  章节
// ------------------------------------------------------------
function drawChapter(ctx, g) {
  const ch = g.chapter;

  ctx.fillStyle = 'rgba(253,243,227,0.32)';
  ctx.font = font(11, 500);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`第 ${g.day} 天`, 28, 46);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(253,243,227,0.3)';
  ctx.fillText(`精神 ${Math.round(g.mental)} · 健康 ${Math.round(g.health)}`, W - 28, 46);

  // 正文
  let text;
  let typing = false;
  if (g.replyLines) {
    text = g.replyLines[g.replyIndex] || '';
  } else {
    text = ch.lines[g.chapterLine] || '';
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(253,243,227,0.92)';
  ctx.font = font(16, 400);
  const lines = wrap(ctx, text, W - 96);
  let y = 120;
  for (const l of lines) {
    ctx.fillText(l, 48, y);
    y += 30;
  }

  if (g.choiceActive) {
    ctx.fillStyle = 'rgba(255,111,156,0.9)';
    ctx.font = font(12, 600);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(ch.choice.prompt, 40, 384);

    ch.choice.options.forEach((opt, i) => {
      const r = LAYOUT.chapterOptions[i];
      if (!r) return;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      rr(ctx, r.x, r.y, r.w, r.h, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,200,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = 'rgba(253,243,227,0.9)';
      ctx.font = font(14, 500);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(opt.label, r.x + r.w / 2, r.y + r.h / 2);
    });
  } else {
    ctx.fillStyle = 'rgba(253,243,227,0.32)';
    ctx.font = font(12, 400);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('点击继续', W / 2, H - 76);
  }

  ctx.fillStyle = 'rgba(253,243,227,0.18)';
  ctx.font = font(10, 400);
  ctx.textAlign = 'center';
  ctx.fillText(NOTE, W / 2, H - 32);
}

// ------------------------------------------------------------
//  直播
// ------------------------------------------------------------
function drawHud(ctx, g) {
  ctx.fillStyle = 'rgba(10,8,14,0.75)';
  ctx.fillRect(0, 0, W, 92);

  const left = Math.max(0, g.timeLeft);
  const mm = Math.floor(left / 60);
  const ss = Math.floor(left % 60);
  ctx.fillStyle = left <= 15 ? '#ff8a7a' : 'rgba(253,243,227,0.72)';
  ctx.font = font(13, 600);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${mm}:${String(ss).padStart(2, '0')}`, W - 16, 20);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#ff6f9c';
  ctx.beginPath();
  ctx.arc(24, 20, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(253,243,227,0.8)';
  ctx.font = font(12, 600);
  ctx.fillText('LIVE', 33, 20.5);

  ctx.fillStyle = 'rgba(253,243,227,0.38)';
  ctx.font = font(11, 400);
  ctx.fillText(`第 ${g.day} 天 · 目标 ${g.goal}`, 72, 20.5);

  bar(ctx, 14, 46, 126, '关注度', g.attention, Math.max(1, g.goal), '#ff6f9c');
  bar(ctx, 172, 46, 126, '精神', g.mental, MAX.mental, '#a9c8ff');
  bar(ctx, 330, 46, 126, '健康', g.health, MAX.health, '#8fd18a');
}

function bar(ctx, x, y, w, label, value, max, color) {
  ctx.fillStyle = 'rgba(253,243,227,0.5)';
  ctx.font = font(10, 500);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(253,243,227,0.9)';
  ctx.font = font(10, 700);
  ctx.fillText(`${Math.floor(value)}`, x + w, y);

  const by = y + 9;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  rr(ctx, x, by, w, 7, 3.5);
  ctx.fill();
  const ratio = Math.max(0, Math.min(1, value / max));
  if (ratio > 0) {
    ctx.fillStyle = color;
    rr(ctx, x, by, Math.max(5, w * ratio), 7, 3.5);
    ctx.fill();
  }
}

function drawStage(ctx, g, ui) {
  const top = LAYOUT.stageTop;
  const bottom = LAYOUT.stageBottom;

  const room = ctx.createRadialGradient(W / 2, 190, 30, W / 2, 220, 300);
  room.addColorStop(0, 'rgba(120,90,140,0.22)');
  room.addColorStop(1, 'rgba(10,8,14,0)');
  ctx.fillStyle = room;
  ctx.fillRect(0, top, W, bottom - top);

  for (const d of ui.danmaku) {
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = d.color;
    ctx.font = font(13, 500);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.text, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  drawAvatar(ctx, g);
  drawPopups(ctx, g);

  // 他抢走一段时的字幕
  if (g.takeover) {
    const a = Math.min(1, g.takeover.life);
    ctx.fillStyle = `rgba(8,30,34,${0.9 * a})`;
    rr(ctx, 22, 300, W - 44, 44, 10);
    ctx.fill();
    ctx.fillStyle = `rgba(200,255,244,${a})`;
    ctx.font = font(16, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(g.takeover.text, W / 2, 322);
  }

  if (g.interference) {
    const it = g.interference;
    const ratio = Math.max(0, it.timeLeft / it.maxTime);
    const mash = Math.max(0, Math.min(1, it.prog || 0));
    const pulse = it.pulse || 0;
    // 时间越少，闪得越快
    const speed = 4 + (1 - ratio) * 46;
    const flicker = 0.5 + 0.5 * Math.sin((performance.now() / 1000) * speed);
    const box = LAYOUT.interference;
    const { x: boxX, y: boxY, w: boxW, h: boxH } = box;

    const crit = !!it.critical;
    const grad = ctx.createLinearGradient(0, boxY, 0, boxY + boxH);
    if (crit) {
      grad.addColorStop(0, '#ff2b2b');
      grad.addColorStop(0.55, '#c40000');
      grad.addColorStop(1, '#6d0000');
    } else {
      grad.addColorStop(0, '#d42a2a');
      grad.addColorStop(0.55, '#a81616');
      grad.addColorStop(1, '#6d0b0b');
    }
    ctx.fillStyle = grad;
    rr(ctx, boxX, boxY, boxW, boxH, 16);
    ctx.fill();

    // 频闪：整块面板在亮红上叠一层跳动的光
    ctx.fillStyle = `rgba(255,90,70,${0.16 * flicker})`;
    rr(ctx, boxX, boxY, boxW, boxH, 16);
    ctx.fill();

    // 点一下面板亮一下
    if (pulse > 0) {
      ctx.fillStyle = `rgba(255,255,255,${0.1 * pulse})`;
      rr(ctx, boxX, boxY, boxW, boxH, 16);
      ctx.fill();
    }

    ctx.strokeStyle = crit
      ? `rgba(255,40,30,${0.5 + 0.5 * flicker})`
      : `rgba(255,96,80,${0.35 + 0.65 * flicker})`;
    ctx.lineWidth = crit ? 3.2 : 2.4;
    ctx.stroke();

    ctx.fillStyle = `rgba(255,226,220,${0.55 + 0.45 * flicker})`;
    ctx.font = font(12, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('戏 · 中 · 人', W / 2, boxY + 30);

    // 时间只剩一个不显眼的小数字（不留进度条）
    ctx.textAlign = 'right';
    ctx.font = font(11, 500);
    ctx.fillStyle = 'rgba(255,214,206,0.5)';
    ctx.fillText(`${Math.max(0, it.timeLeft).toFixed(1)}s`, boxX + boxW - 22, boxY + 30);

    ctx.fillStyle = '#fff4f1';
    ctx.font = font(27, 700);
    ctx.textAlign = 'center';
    const lines = wrap(ctx, it.text, W - 76);
    const baseY = boxY + boxH / 2 - 34 - (lines.length - 1) * 19;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, baseY + i * 38));

    // 清除进度：只有一条，不显示次数，只让你看见「在涨」和「在掉」
    const barX = boxX + 40;
    const barW = boxW - 80;
    const punch = it.punch || 0;
    const barH = 8 + punch * 4;
    const pY = boxY + boxH - 64 - punch * 2;

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, barX, pY, barW, barH, barH / 2);
    ctx.fill();

    if (mash > 0) {
      const fillW = Math.max(barH, barW * mash);
      ctx.save();
      ctx.beginPath();
      rr(ctx, barX, pY, fillW, barH, barH / 2);
      ctx.clip();
      const g2 = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      g2.addColorStop(0, 'rgba(127,224,208,0.55)');
      g2.addColorStop(1, 'rgba(230,255,250,1)');
      ctx.fillStyle = g2;
      ctx.fillRect(barX, pY, fillW, barH);
      // 打中的那一下，整条泛白
      if (punch > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.55 * punch})`;
        ctx.fillRect(barX, pY, fillW, barH);
      }
      ctx.restore();

      // 头部亮一下，点的时候更明显
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * Math.max(pulse, punch)})`;
      rr(ctx, barX + fillW - 4 - punch * 2, pY - 2, 4 + punch * 3, barH + 4, 3);
      ctx.fill();
    }

    // 时间快没了：提示变色并抽动，逼你继续点
    const urgent = it.timeLeft < 1.2;
    const blink = urgent ? 0.65 + 0.35 * Math.sin(performance.now() / 70) : 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = urgent
      ? `rgba(255,236,120,${0.75 * blink})`
      : 'rgba(255,236,231,0.8)';
    ctx.font = font(urgent ? 13 : 11.5, 600);
    const hintY = boxY + boxH - 30 + (urgent ? Math.sin(performance.now() / 55) * 1.2 : 0);
    ctx.fillText('连续点击任意处以屏蔽戏中人干扰！', W / 2, hintY);
  }

  // 交还话筒之后，手还在抖
  if (g.possession <= 0 && g.afterglow > 0) {
    ctx.fillStyle = 'rgba(140,20,20,0.10)';
    ctx.fillRect(0, top, W, bottom - top);
    ctx.strokeStyle = 'rgba(255,120,100,0.28)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(4, top + 4, W - 8, bottom - top - 8);
    ctx.fillStyle = 'rgba(255,150,130,0.85)';
    ctx.font = font(11, 600);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`手还在抖 · 收益减半 · ${g.afterglow.toFixed(1)}`, W / 2, top + 16);
  }

  // 他接管直播间的几秒
  if (g.possession > 0) {
    ctx.fillStyle = 'rgba(200,30,30,0.12)';
    ctx.fillRect(0, top, W, bottom - top);
    ctx.strokeStyle = 'rgba(255,90,70,0.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(4, top + 4, W - 8, bottom - top - 8);

    ctx.fillStyle = 'rgba(255,120,100,0.95)';
    ctx.font = font(13, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`他把这一段接过去了 · ${g.possession.toFixed(1)}`, W / 2, top + 18);
  }

}

// ------------------------------------------------------------
//  立绘：戏中人
//  原图带透明通道、在半身处被切断。所有状态（精神越差越偏红、
//  重影、接管时泛青）都在离屏画布上合成，不去改原图。
//  离屏画布按原图尺寸建，保证在 2x 屏上不糊。
// ------------------------------------------------------------
const PORTRAIT = new Image();
let portraitReady = false;

// 两块离屏画布：一块画"本体"（会随精神值变红），一块画"重影"（恒定青色）。
// 每块各自记住上次用的颜色/浓度，值没变就直接复用，不重复合成。
function makeLayer() {
  const canvas = document.createElement('canvas');
  return { canvas, ctx: canvas.getContext('2d'), tint: null, amount: -1 };
}
const layerMain = makeLayer();
const layerGhost = makeLayer();

PORTRAIT.addEventListener('load', () => {
  for (const layer of [layerMain, layerGhost]) {
    layer.canvas.width = PORTRAIT.naturalWidth || 1;
    layer.canvas.height = PORTRAIT.naturalHeight || 1;
    layer.tint = null;
    layer.amount = -1;
  }
  portraitReady = true;
});
PORTRAIT.src = PORTRAIT_SRC;

// 把立绘合成进某一块离屏画布并返回它。染色用 source-atop，
// 只作用在不透明的像素上，所以不会染到背景。
function paintLayer(layer, tint, amount) {
  const key = Math.round(Math.max(0, amount) * 50) / 50;
  if (layer.tint === tint && layer.amount === key) return layer.canvas;
  layer.tint = tint;
  layer.amount = key;

  const c = layer.ctx;
  const bw = layer.canvas.width;
  const bh = layer.canvas.height;
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;
  c.clearRect(0, 0, bw, bh);
  c.drawImage(PORTRAIT, 0, 0, bw, bh);
  if (tint && amount > 0) {
    c.globalCompositeOperation = 'source-atop';
    c.globalAlpha = Math.min(1, amount);
    c.fillStyle = tint;
    c.fillRect(0, 0, bw, bh);
    c.globalAlpha = 1;
  }
  // 原图在腰那里就被切断了，直接贴会有一条硬边。
  // 在离屏画布上把下缘擦成渐变，背景就能透上来。
  const fadeTop = bh * 0.72;
  const fade = c.createLinearGradient(0, fadeTop, 0, bh);
  fade.addColorStop(0, 'rgba(0,0,0,0)');
  fade.addColorStop(1, 'rgba(0,0,0,1)');
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = fade;
  c.fillRect(0, fadeTop, bw, bh - fadeTop);
  c.globalCompositeOperation = 'source-over';
  return layer.canvas;
}

// 按原图比例摆在舞台里：高度定死（保证不会顶到进度条、也压不到按钮），
// 宽度跟着算，水平居中。换立绘不用再调数字。
const PORTRAIT_HEIGHT = 360;
const PORTRAIT_TOP = 126;

function portraitBox() {
  const iw = PORTRAIT.naturalWidth || 1;
  const ih = PORTRAIT.naturalHeight || 1;
  const h = PORTRAIT_HEIGHT;
  const w = (h * iw) / ih;
  return { x: (W - w) / 2, y: PORTRAIT_TOP, w, h };
}

function drawAvatar(ctx, g) {
  const dmg = 1 - g.mental / MAX.mental;
  const b = portraitBox();
  const ready = portraitReady;

  ctx.save();

  // 背后的光：精神越差，红光越重
  const halo = ctx.createRadialGradient(W / 2, b.y + 130, 20, W / 2, b.y + 150, 240);
  halo.addColorStop(0, `rgba(255,111,156,${0.12 + dmg * 0.22})`);
  halo.addColorStop(1, 'rgba(255,111,156,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, LAYOUT.stageTop, W, LAYOUT.stageBottom - LAYOUT.stageTop);

  if (!ready) {
    ctx.restore();
    return;
  }

  // 重影：精神崩到一定程度，立绘开始「对不齐」
  if (dmg > 0.35) {
    const off = dmg * 5;
    const ghost = paintLayer(layerGhost, '#7fe0d0', 1);
    for (let i = 1; i <= 2; i++) {
      ctx.globalAlpha = 0.1 * dmg;
      ctx.drawImage(ghost, b.x + off * i, b.y, b.w, b.h);
    }
    ctx.globalAlpha = 1;
  }

  // 本体：精神越低，越往暗红里沉
  ctx.drawImage(paintLayer(layerMain, '#5c1020', dmg * 0.34), b.x, b.y, b.w, b.h);

  // 他接管直播间的时候，立绘泛青
  if (g.possession > 0 || g.takeover) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 130);
    ctx.drawImage(paintLayer(layerGhost, '#7fe0d0', 0.16 + 0.1 * pulse), b.x, b.y, b.w, b.h);
  }

  // 扫描线
  if (dmg > 0.5) {
    for (let i = 0; i < 5; i++) {
      const y = b.y + 20 + Math.random() * (b.h - 40);
      ctx.globalAlpha = 0.08 * dmg;
      ctx.fillStyle = '#7fe0d0';
      ctx.fillRect(b.x + 24, y, b.w - 48, 2 + Math.random() * 3);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function ellipsis(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let out = text;
  while (out.length > 1 && ctx.measureText(out + '…').width > maxW) out = out.slice(0, -1);
  return out + '…';
}

const TYPE_COLOR = {
  comfort: '#c2607f',
  sad: '#8f6bb5',
  ask: '#46789a',
  rant: '#b8463f',
  spam: '#b98a2f',
  joke: '#b98a2f',
  song: '#4a6a9a',
  gift: '#b98a2f',
  probe: '#4a6a9a',
};

// 弹幕气泡：在屏幕任意位置弹出，各自倒计时
function drawPopups(ctx, g) {
  const active = activeBubble(g);
  const t = performance.now() / 1000;

  for (const p of g.popups) {
    const grow = Math.min(1, p.age / 0.16);
    const scale = 0.88 + 0.12 * grow;
    const alpha = Math.min(1, grow * 1.3);
    const bob = Math.sin(t * 1.7 + p.phase) * 2.4;
    const isActive = !!active && active.id === p.id;
    const ratio = Math.max(0, p.timeLeft / p.maxTime);
    const color = TYPE_COLOR[p.type] || '#c2607f';

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2 + bob);
    ctx.scale(scale, scale);
    ctx.translate(-p.w / 2, -p.h / 2);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, 2, 4, p.w, p.h, 12);
    ctx.fill();

    ctx.fillStyle = isActive ? 'rgba(253,243,227,0.98)' : 'rgba(236,229,220,0.9)';
    rr(ctx, 0, 0, p.w, p.h, 12);
    ctx.fill();

    ctx.strokeStyle = isActive ? 'rgba(255,111,156,0.9)' : 'rgba(43,34,48,0.16)';
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.stroke();

    if (isActive) {
      ctx.fillStyle = color;
      rr(ctx, 0, 12, 3.5, p.h - 24, 2);
      ctx.fill();
    }

    ctx.fillStyle = color;
    ctx.font = font(10, 700);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(TYPE_TAG[p.type] || '弹幕', 13, 15);

    ctx.fillStyle = '#2b2230';
    ctx.font = font(12.5, 500);
    const lines = wrap(ctx, p.text, p.w - 26).slice(0, 2);
    lines.forEach((l, i) => ctx.fillText(l, 13, 35 + i * 17));

    const bw = p.w - 26;
    ctx.fillStyle = 'rgba(43,34,48,0.1)';
    ctx.fillRect(13, p.h - 8, bw, 3);
    ctx.fillStyle = ratio > 0.45 ? color : '#e2695c';
    ctx.fillRect(13, p.h - 8, bw * ratio, 3);

    ctx.restore();
  }

  if (!g.popups.length) {
    const busy = g.possession > 0;
    ctx.fillStyle = busy ? 'rgba(255,150,130,0.7)' : 'rgba(253,243,227,0.32)';
    ctx.font = font(12, 400);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(busy ? '他在替你说话……' : '……弹幕还没刷起来', W / 2, 432);
  }
}


function drawScene(ctx, g) {
  ctx.fillStyle = '#080405';
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, H / 2 - 40, 20, W / 2, H / 2 - 40, 260);
  glow.addColorStop(0, 'rgba(160,10,10,0.35)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 故障横带
  ctx.fillStyle = 'rgba(255,60,50,0.06)';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 3);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const t = performance.now();
  for (let i = 0; i <= Math.min(g.sceneIndex, g.sceneLines.length - 1); i++) {
    const cur = i === g.sceneIndex;
    const text = g.sceneLines[i];
    const y = H / 2 - 40 + i * 76;
    // 台词在抖：当前这句幅度大一些
    const jitter = (Math.random() - 0.5) * (cur ? 3 : 1.2);

    ctx.font = font(cur ? 22 : 16, cur ? 700 : 400);
    if (cur) {
      // 色差：红、青各偏一点，像信号没对上
      ctx.fillStyle = 'rgba(255,50,40,0.5)';
      ctx.fillText(text, W / 2 - 2.2 + jitter, y);
      ctx.fillStyle = 'rgba(90,230,220,0.42)';
      ctx.fillText(text, W / 2 + 2.2 + jitter, y);
    }
    ctx.fillStyle = cur
      ? `rgba(255,240,238,${0.86 + 0.14 * Math.sin(t / 90)})`
      : 'rgba(255,200,195,0.45)';
    ctx.fillText(text, W / 2 + jitter, y);
  }

  // 台词出来的时候，整个画面也在坏
  drawGlitchFx(ctx, {
    dim: 0.06,
    red: 0.1,
    scan: 0.14,
    noise: 12,
    slices: 4 + g.sceneIndex * 2,
    maxShift: 24,
    avoid: { y0: H / 2 - 110, y1: H / 2 + 90 },
  });

  // 提示放在故障之后画，保证一直看得清
  ctx.fillStyle = 'rgba(255,120,110,0.5)';
  ctx.font = font(11, 400);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('点击继续', W / 2, H - 90);

  void CHAPTERS;
}

function drawRetry(ctx, g) {
  ctx.fillStyle = '#0b0810';
  ctx.fillRect(0, 0, W, H);

  const mental = g.retryReason !== 'collapse';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(253,243,227,0.4)';
  ctx.font = font(12, 500);
  ctx.fillText(`第 ${g.day} 天 · 直播间`, W / 2, 150);

  ctx.fillStyle = mental ? '#a9c8ff' : '#8fd18a';
  ctx.font = font(30, 700);
  ctx.fillText(mental ? '精神值归零' : '撑不住了', W / 2, 206);

  ctx.fillStyle = 'rgba(253,243,227,0.7)';
  ctx.font = font(13, 400);
  const sub = mental ? '他赢了这一场。' : '身体先一步罢工了。';
  ctx.fillText(sub, W / 2, 252);
  ctx.fillStyle = 'rgba(253,243,227,0.45)';
  ctx.font = font(12, 400);
  ctx.fillText('今天还没结束 —— 这一场可以重来。', W / 2, 280);

  const r = LAYOUT.retry;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  rr(ctx, r.x, r.y, r.w, r.h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,180,200,0.5)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(253,243,227,0.92)';
  ctx.font = font(16, 700);
  ctx.fillText('重来这一场', W / 2, r.y + r.h / 2);

  const q = LAYOUT.giveup;
  ctx.fillStyle = 'rgba(253,243,227,0.3)';
  ctx.font = font(12, 500);
  ctx.fillText('就这样吧', W / 2, q.y + q.h / 2);
}

function drawControls(ctx, g) {
  const slots = corruptedSlots(g);
  const cd = g.suppressCd || 0;
  const ready = cd <= 0;
  const hasTarget = canSuppress(g);
  const it = g.interference;
  const mash = it ? Math.max(0, Math.min(1, it.prog || 0)) : 0;

  ACTIONS.forEach((a, i) => {
    const r = LAYOUT.actions[i];
    const enabled = g.popups.length > 0 && g.phase === 'live' && g.possession <= 0;
    const corrupted = enabled && slots.has(i);
    const victim = corrupted ? hijackAt(g, i) : null;
    const color = corrupted ? '#7fe0d0' : a.color;
    const blink = corrupted ? 0.75 + 0.25 * Math.sin(performance.now() / 160) : 1;

    ctx.fillStyle = enabled ? hexA(color, corrupted ? 0.2 * blink : 0.14) : 'rgba(255,255,255,0.04)';
    rr(ctx, r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.strokeStyle = enabled ? hexA(color, (corrupted ? 0.95 : 0.5) * blink) : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = corrupted ? 1.8 : 1;
    ctx.stroke();

    ctx.fillStyle = enabled ? color : 'rgba(253,243,227,0.3)';
    ctx.font = font(corrupted ? 13 : 14, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(corrupted ? CORRUPT.label : a.label, r.x + r.w / 2, r.y + 26);

    ctx.fillStyle = enabled ? 'rgba(253,243,227,0.6)' : 'rgba(253,243,227,0.2)';
    ctx.font = font(9.5, 400);
    ctx.fillText(corrupted ? victim.corruptText : a.desc, r.x + r.w / 2, r.y + 46);
  });

  // 屏蔽：小圆钮，常驻
  const s = LAYOUT.suppress;
  const cx = s.x + s.w / 2;
  const cy = s.y + s.h / 2;
  const radius = 29;
  const live = hasTarget && (ready || !!it) && g.possession <= 0;

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = live ? 'rgba(127,224,208,0.18)' : 'rgba(255,255,255,0.05)';
  ctx.fill();
  ctx.strokeStyle = live ? 'rgba(127,224,208,0.85)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = live ? 1.8 : 1;
  ctx.stroke();

  if (it) {
    // 抢麦时的按钮：扇形显示已点了几下（和面板上的进度条同一份数据）
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius - 1, -Math.PI / 2, -Math.PI / 2 + mash * Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(127,224,208,0.3)';
    ctx.fill();
  } else if (cd > 0) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius - 1, -Math.PI / 2, -Math.PI / 2 + (cd / CONFIG.suppressCd) * Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fill();
  }

  ctx.fillStyle = ready ? (hasTarget ? '#d8fff7' : 'rgba(253,243,227,0.42)') : 'rgba(253,243,227,0.38)';
  ctx.font = font(ready ? 12 : 13, 700);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ready ? '屏蔽' : cd.toFixed(1), cx, cy);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// 点一下就在手指的位置炸一圈：环 + 四道短线
function drawHits(ctx, g) {
  for (const h of g.hits) {
    const k = 1 - h.life / h.max; // 0 -> 1
    const r = 10 + 30 * k;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = '#eafffb';
    ctx.lineWidth = 3 * (1 - k) + 0.8;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 2 * (1 - k) + 0.5;
    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 4 + (i * Math.PI) / 2;
      const r0 = r + 4;
      const r1 = r + 10 + 8 * k;
      ctx.beginPath();
      ctx.moveTo(h.x + Math.cos(a) * r0, h.y + Math.sin(a) * r0);
      ctx.lineTo(h.x + Math.cos(a) * r1, h.y + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawFloats(ctx, g) {
  for (const f of g.floats) {
    ctx.globalAlpha = Math.min(1, (f.life / f.maxLife) * 1.6);
    ctx.font = font(15, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(10,8,14,0.8)';
    ctx.lineWidth = 3.5;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------
//  每天结算
// ------------------------------------------------------------
function drawSummary(ctx, g) {
  const s = g.summary;
  ctx.fillStyle = '#0b0810';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = font(12, 500);
  ctx.fillText(`第 ${s.day} 天 · 收播`, W / 2, 150);

  ctx.fillStyle = s.met ? '#8fd18a' : '#e2695c';
  ctx.font = font(30, 700);
  ctx.fillText(`+${s.gained}`, W / 2, 208);

  ctx.fillStyle = 'rgba(253,243,227,0.55)';
  ctx.font = font(12, 400);
  ctx.fillText('今天的关注', W / 2, 240);

  ctx.fillStyle = 'rgba(253,243,227,0.85)';
  ctx.font = font(13, 500);
  ctx.fillText(`累计 ${s.total} / 目标 ${s.goal}`, W / 2, 282);

  ctx.fillStyle = s.met ? 'rgba(143,209,138,0.9)' : 'rgba(226,105,92,0.9)';

  ctx.fillText(s.met ? '今天达标了' : '今天没达标', W / 2, 308);

  // 数值
  const rows = [
    ['精神', s.mental, MAX.mental, '#a9c8ff'],

  ];
  rows.forEach(([label, v, max, color], i) => {
    const y = 372 + i * 46;
    ctx.textAlign = 'left';

    ctx.fillText(label, 60, y);
    ctx.textAlign = 'right';

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    rr(ctx, 60, y + 12, W - 120, 8, 4);
    ctx.fill();
    ctx.fillStyle = color;
    rr(ctx, 60, y + 12, Math.max(6, (W - 120) * (v / max)), 8, 4);
    ctx.fill();
  });

  ctx.fillStyle = 'rgba(253,243,227,0.6)';
  ctx.font = font(13, 600);
  ctx.textAlign = 'center';
  ctx.fillText('点击继续', W / 2, H - 90);
}

// ------------------------------------------------------------
//  结局
// ------------------------------------------------------------
// ------------------------------------------------------------
//  结局前的息屏 / 亮屏
//  熄屏：上一帧画面被竖向压成一条线，收线时留一点余辉；
//  亮屏：线再展开成全屏，结局内容跟着铺开，同时一层过曝回落。
// ------------------------------------------------------------
const POWER = { collapse: 0.30, dark: 0.06, flashIn: 0.09, flash: 0.08, reveal: 0.34 };
const POWER_TOTAL =
  POWER.collapse + POWER.dark + POWER.flashIn + POWER.flash + POWER.reveal;
const T_DARK = POWER.collapse;
const T_FLASH_IN = T_DARK + POWER.dark;
const T_FLASH = T_FLASH_IN + POWER.flashIn;
const T_REVEAL = T_FLASH + POWER.flash;

const powerBuf = document.createElement('canvas');   // 上一帧（直播间 / 彩蛋）
const powerCtx = powerBuf.getContext('2d');
const endingBuf = document.createElement('canvas');  // 结局画面，画一次用来带模糊贴回来
const endingCtx = endingBuf.getContext('2d');
let powerPhase = null;
let powerStart = 0;
let powerDpr = 1;
let powerFreeze = null; // 调试用：把动画定格在第 N 秒

function setEndingFxOffset(sec) {
  const n = Number(sec);
  powerFreeze = Number.isFinite(n) ? n : null;
}

function powerElapsed() {
  if (powerFreeze !== null) return powerFreeze;
  return (performance.now() - powerStart) / 1000;
}

// 结局动画还没播完时，别让点击直接把整局重置掉
function endingFxBusy() {
  return powerPhase === 'ending' && powerElapsed() < POWER_TOTAL;
}

function blitFiltered(ctx, buf, filter, scale, alpha) {
  const s = Math.max(1, scale);
  const dx = W / 2 - (W * s) / 2;
  const dy = H / 2 - (H * s) / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  if ('filter' in ctx && filter) ctx.filter = filter;
  ctx.drawImage(buf, 0, 0, buf.width, buf.height, dx, dy, W * s, H * s);
  ctx.filter = 'none';
  ctx.restore();
}

function drawEnding(ctx, g) {
  const t = powerElapsed();
  if (t >= POWER_TOTAL) {
    drawEndingBody(ctx, g);
    return;
  }

  // 1) 黑屏坍缩：上一帧往中间缩，同时被黑吃掉
  if (t < T_DARK) {
    const p = t / POWER.collapse;
    const s = 1 - 0.16 * p;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 1 - p * p;
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(powerBuf, 0, 0, powerBuf.width, powerBuf.height, 0, 0, W, H);
    ctx.restore();
    const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.15, W / 2, H / 2, W * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.4 + 0.6 * p})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    return;
  }

  // 2) 全黑
  if (t < T_FLASH_IN) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  // 3) 白闪升起
  if (t < T_FLASH) {
    const p = (t - T_FLASH_IN) / POWER.flashIn;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,255,255,${p * p})`;
    ctx.fillRect(0, 0, W, H);
    return;
  }

  // 4) 闪出结局：从白里"啪"一下出来，虚化和过曝很快退掉
  if (t < T_REVEAL) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const p = (t - T_REVEAL) / POWER.reveal;
  const q = 1 - p;

  endingCtx.setTransform(powerDpr, 0, 0, powerDpr, 0, 0);
  endingCtx.clearRect(0, 0, W, H);
  drawEndingBody(endingCtx, g);

  const blur = Math.pow(q, 2) * 7;
  const bright = 1 + 0.45 * q * q;
  blitFiltered(ctx, endingBuf, `blur(${blur}px) brightness(${bright})`, 1 + q * 0.03, 1);

  ctx.fillStyle = `rgba(255,255,255,${0.88 * Math.pow(q, 1.5)})`;
  ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------
//  结局背景：按评级给不同的底噪和运动，别让结局是一张死图
// ------------------------------------------------------------
function drawEndingAmbient(ctx, rank, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.9);

  if (rank === 'BAD END') {
    ctx.fillStyle = '#08040a';
    ctx.fillRect(0, 0, W, H);

    const g1 = ctx.createRadialGradient(W / 2, H * 0.6, 30, W / 2, H * 0.6, 380);
    g1.addColorStop(0, `rgba(158,20,18,${0.3 + 0.18 * pulse})`);
    g1.addColorStop(0.5, `rgba(96,10,14,${0.16 + 0.08 * pulse})`);
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

    for (let i = 0; i < 4; i++) {
      if (Math.random() > 0.42) continue;
      ctx.fillStyle = `rgba(255,70,55,${0.05 + Math.random() * 0.09})`;
      ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 3);
    }

    if (Math.random() < 0.07) {
      const dpr = ctx.canvas.width / W;
      const sy = Math.random() * ctx.canvas.height;
      const sh = (6 + Math.random() * 18) * dpr;
      const dx = (Math.random() - 0.5) * 16 * dpr;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(ctx.canvas, 0, sy, ctx.canvas.width, sh, dx, sy, ctx.canvas.width, sh);
      ctx.restore();
    }
    return;
  }

  if (rank === 'ANOTHER END') {
    ctx.fillStyle = '#05090c';
    ctx.fillRect(0, 0, W, H);
    const drift = Math.sin(t * 0.35) * 60;
    const g2 = ctx.createRadialGradient(W / 2 + drift, H * 0.42, 20, W / 2 + drift, H * 0.42, 340);
    g2.addColorStop(0, `rgba(50,180,170,${0.16 + 0.06 * pulse})`);
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 9; i++) {
      const x = (i * 61 + ((t * 12) % 61)) % W;
      ctx.fillStyle = `rgba(127,224,208,${0.018 + 0.012 * Math.sin(t * 1.3 + i)})`;
      ctx.fillRect(x, 0, 18, H);
    }
    return;
  }

  if (rank === 'TRUE END') {
    ctx.fillStyle = '#0b0810';
    ctx.fillRect(0, 0, W, H);
    const g3 = ctx.createRadialGradient(W / 2, H * 1.05, 40, W / 2, H * 1.05, 420);
    g3.addColorStop(0, `rgba(255,150,90,${0.22 + 0.08 * pulse})`);
    g3.addColorStop(0.6, 'rgba(120,60,90,0.1)');
    g3.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g3;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 22; i++) {
      const x = (i * 137.5) % W;
      const sp = 5 + (i % 6) * 2.4;
      const y = H - ((t * sp + i * 53) % (H + 60));
      ctx.fillStyle = `rgba(255,214,168,${0.06 + 0.05 * Math.sin(t * 1.7 + i)})`;
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    return;
  }

  ctx.fillStyle = '#080910';
  ctx.fillRect(0, 0, W, H);
  const g4 = ctx.createRadialGradient(W / 2, H * 0.45, 30, W / 2, H * 0.45, 360);
  g4.addColorStop(0, `rgba(90,120,180,${0.1 + 0.05 * pulse})`);
  g4.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g4;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) {
    const x = (i * 173.3) % W;
    const sp = 3 + (i % 4) * 2;
    const y = H - ((t * sp + i * 79) % (H + 40));
    ctx.fillStyle = `rgba(169,200,255,${0.04 + 0.03 * Math.sin(t + i)})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}

function drawEndingBody(ctx, g) {
  const e = g.ending;
  const t = performance.now() / 1000;
  drawEndingAmbient(ctx, e.rank, t);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bad = e.rank === 'BAD END';
  const rankColor =
    e.rank === 'TRUE END' ? '#ffd479' : bad ? '#e2695c' : e.rank === 'ANOTHER END' ? '#7fe0d0' : '#a9c8ff';

  ctx.save();
  ctx.globalAlpha = 0.82 + 0.18 * Math.sin(t * 1.6);
  ctx.fillStyle = rankColor;
  ctx.font = font(12, 700);
  ctx.fillText(e.rank, W / 2, 112);
  ctx.restore();

  // BAD END 的标题会偶尔抽搐一下
  const glitch = bad && Math.random() < 0.1;
  const tx = W / 2 + (glitch ? (Math.random() - 0.5) * 6 : 0);
  if (glitch) {
    ctx.fillStyle = 'rgba(255,60,50,0.5)';
    ctx.font = font(34, 700);
    ctx.fillText(e.title, tx - 2, 158);
    ctx.fillStyle = 'rgba(90,230,220,0.4)';
    ctx.fillText(e.title, tx + 2, 158);
  }
  ctx.fillStyle = '#fdf3e3';
  ctx.font = font(34, 700);
  ctx.fillText(e.title, tx, 158);

  ctx.font = font(13, 400);
  ctx.fillStyle = 'rgba(253,243,227,0.78)';
  let y = 216;
  for (const line of e.lines) {
    for (const l of wrap(ctx, line, W - 90)) {
      ctx.fillText(l, W / 2, y);
      y += 22;
    }
    y += 8;
  }

  ctx.fillStyle = 'rgba(253,243,227,0.45)';
  ctx.font = font(12, 500);
  ctx.fillText(`关注 ${Math.round(g.attention)} · 接住 ${g.matched} · 漏接 ${g.dropped}`, W / 2, 470);
  ctx.fillText(`交给他 ${g.surrenders} 次 · 压制 ${g.suppressed} 次`, W / 2, 492);

  ctx.save();
  ctx.globalAlpha = 0.45 + 0.25 * Math.sin(t * 2.2);
  ctx.fillStyle = '#fdf3e3';
  ctx.font = font(13, 600);
  ctx.fillText('点击从头再来', W / 2, 560);
  ctx.restore();
}

void CHAPTERS;
// ===== src/main.js =====
// ============================================================
//  入口：画布、弹幕装饰、输入、主循环
// ============================================================


const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const game = createGame();

const ui = { danmaku: [] };
const LANES = [104, 126, 148];

const byType = {};
for (const a of ACTIONS) for (const t of a.good) if (!byType[t]) byType[t] = a.id;

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = `${Math.round(W * scale)}px`;
  canvas.style.height = `${Math.round(H * scale)}px`;
}

window.addEventListener('resize', fit);
fit();

// ------------------------------------------------------------
//  装饰弹幕
// ------------------------------------------------------------
let ambientTimer = 0;
function tickAmbient(dt) {
  ambientTimer -= dt;
  if (ambientTimer <= 0 && game.phase === 'live') {
    ambientTimer = 0.55 + Math.random() * 0.9;
    const lane = LANES[Math.floor(Math.random() * LANES.length)];
    const busy = ui.danmaku.some((d) => Math.abs(d.y - lane) < 1 && d.x > W - 130);
    if (!busy) {
      ui.danmaku.push({
        text: AMBIENT[Math.floor(Math.random() * AMBIENT.length)],
        x: W + 20,
        y: lane,
        speed: 34 + Math.random() * 26,
        alpha: 0.16 + Math.random() * 0.22,
        color: Math.random() > 0.8 ? '#ffb3a7' : '#e8e2f0',
      });
    }
  }
  for (let i = ui.danmaku.length - 1; i >= 0; i--) {
    const d = ui.danmaku[i];
    d.x -= d.speed * dt;
    if (d.x < -260) ui.danmaku.splice(i, 1);
  }
}

// ------------------------------------------------------------
//  输入
// ------------------------------------------------------------
function toLogical(evt) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((evt.clientX - r.left) / r.width) * W,
    y: ((evt.clientY - r.top) / r.height) * H,
  };
}

const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

function restart() {
  Object.assign(game, createGame());
  ui.danmaku.length = 0;
}

function tapAction(index) {
  if (game.phase !== 'live') return;
  if (corruptedSlots(game).has(index)) {
    letHimSay(game, index);
    return;
  }
  respond(game, ACTIONS[index].id);
}

function handleTap(p) {
  const g = game;

  if (g.phase === 'scene') {
    advanceScene(g);
    return;
  }
  if (g.phase === 'retry') {
    if (inRect(p, LAYOUT.retry)) retryLevel(g);
    else if (inRect(p, LAYOUT.giveup)) giveUp(g);
    return;
  }
  if (g.phase === 'ending') {
    if (endingFxBusy()) return; // 息屏/亮屏还没放完
    restart();
    return;
  }
  if (g.phase === 'summary') {
    continueFromSummary(g);
    return;
  }
  if (g.phase === 'chapter') {
    if (g.choiceActive) {
      LAYOUT.chapterOptions.forEach((r, i) => {
        if (inRect(p, r) && g.chapter.choice.options[i]) chooseOption(g, i);
      });
      return;
    }
    advanceChapter(g);
    return;
  }

  // live：抢麦期间点哪里都算连点（提示写的是「连续点击任意处」）
  if (g.interference) {
    if (navigator.vibrate) navigator.vibrate(8); // 手机上每点一下给一下震动
    mashInterference(g, p.x, p.y);
    return;
  }
  if (inRect(p, LAYOUT.suppress)) {
    suppress(g);
    return;
  }
  const hit = hitPopup(g, p.x, p.y);
  if (hit) {
    selectBubble(g, hit.id);
    return;
  }
  LAYOUT.actions.forEach((r, i) => {
    if (inRect(p, r)) tapAction(i);
  });
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleTap(toLogical(e));
});

function advanceByKey() {
  const g = game;
  if (g.phase === 'chapter') {
    if (!g.choiceActive) advanceChapter(g);
  } else if (g.phase === 'summary') {
    continueFromSummary(g);
  } else if (g.phase === 'scene') {
    advanceScene(g);
  } else if (g.phase === 'retry') {
    retryLevel(g);
  } else if (g.phase === 'ending') {
    if (endingFxBusy()) return;
    restart();
  } else {
    suppress(g);
  }
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  const g = game;

  if (k === ' ' || k === 'enter') {
    e.preventDefault();
    advanceByKey();
    return;
  }

  const n = Number(k);
  if (n >= 1 && n <= 4) {
    e.preventDefault();
    if (g.phase === 'chapter' && g.choiceActive) chooseOption(g, n - 1);
    else if (g.phase === 'live') {
      // 抢麦时数字键也算连点一下，避免「按了快捷键结果被扣分」
      if (g.interference) mashInterference(g);
      else tapAction(n - 1);
    }
  }
});

// ------------------------------------------------------------
//  主循环
// ------------------------------------------------------------
let last = performance.now();
let frozen = false; // ?freeze=1：停住时间，只为截图
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (!frozen) {
    update(game, dt);
    tickAmbient(dt);
  }
  draw(game, ctx, ui);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = game;

// ------------------------------------------------------------
//  调试参数（截图 / 自测用）
//   ?skip=1      跳章节，直接开播
//   ?sim=20      自动玩 20 秒
//   ?corrupt=1   保证当前弹幕上出现「让他说」
// ------------------------------------------------------------
const params = new URLSearchParams(location.search);

function autoPlay(seconds, stopAt = null, maxSurrender = 99) {
  const g = game;
  const dt = 1 / 60;
  let actIn = 0.35;
  for (let i = 0; i < seconds * 60; i++) {
    if (stopAt && g.phase === stopAt) break;
    if (g.phase === 'chapter') {
      if (g.choiceActive) chooseOption(g, 0);
      else advanceChapter(g);
      continue;
    }
    if (g.phase === 'summary') {
      continueFromSummary(g);
      continue;
    }
    if (g.phase === 'ending') break;
    if (g.phase === 'retry') { giveUp(g); continue; }
    update(g, dt);
    actIn -= dt;
    if (actIn > 0) continue;            // 模拟真人手速：不要每帧都按
    actIn = 0.35;
    if (g.interference) {
      // 模拟真人连点：一个手速周期（0.35s）里砸三下，约 8~9 下/秒
      for (let k = 0; k < 3 && g.interference; k++) suppress(g);
      continue;
    }
    const slot = [...corruptedSlots(g)][0];
    if (slot !== undefined && g.surrenders < maxSurrender && (maxSurrender < 99 || Math.random() < 0.3)) { letHimSay(g, slot); continue; }
    const head = activeBubble(g);
    if (!head) continue;
    if (g.health < 30 || g.mental < 25) respond(g, 'silent');
    else respond(g, byType[head.type] || 'warm');
  }
}

// ?chapter=night1 直接跳到某个章节；?choice=1 推到出现选项
if (params.has('chapter') && CHAPTERS[params.get('chapter')]) {
  const id = params.get('chapter');
  Object.assign(game, {
    phase: 'chapter', chapterId: id, chapter: CHAPTERS[id],
    chapterLine: 0, choiceActive: false, chosen: false, replyLines: null, replyIndex: 0,
  });
  if (CHAPTERS[id].day) game.day = CHAPTERS[id].day;
  if (params.has('choice')) {
    for (let i = 0; i < 20 && !game.choiceActive; i++) advanceChapter(game);
  }
}
if (params.has('skip')) {
  let guard = 0;
  while (game.phase !== 'live' && game.phase !== 'ending' && guard++ < 200) {
    if (game.phase === 'chapter') {
      if (game.choiceActive) chooseOption(game, 0);
      else advanceChapter(game);
    } else break;
  }
}
if (params.has('idle')) {
  // 只让时间流逝、不做任何回应（截图用）
  const n = Number(params.get('idle') || 0);
  for (let i = 0; i < n * 60; i++) update(game, 1 / 60);
}
if (params.has('sim')) {
  autoPlay(Number(params.get('sim') || 0), null, Number(params.get('surrender') || 99));
}
if (params.has('dayend')) autoPlay(200, 'summary', 0);
if (params.has('cd')) game.suppressCd = Number(params.get('cd') || 0);
// ?pw=0.15 把结局前的息屏/亮屏动画提前 N 秒（截图用）
if (params.has('pw')) setEndingFxOffset(Number(params.get('pw') || 0));
if (params.has('corrupt') && game.phase === 'live') {
  if (!game.popups.length) {
    game.spawnTimer = 0;
    update(game, 0.02);
  }
  const head = game.popups[0];
  if (head) {
    for (const p of game.popups) p.corruptIndex = -1; // 保证只有一个
    head.corruptIndex = correctActionIndex(head.type);
    head.corruptText = '「你累了，我来。」';
  }
}
if (params.has('press')) suppress(game);
if (params.has('interf') && game.phase === 'live') {
  game.interference = makeInterference(game, {
    text: '你知道他们在看什么吗？在看你能撑到什么时候。',
  });
}
if (params.has('possess') && game.phase === 'live') {
  game.possession = Number(params.get('possess') || 2.4);
}
if (params.has('crit') && game.phase === 'live') {
  game.mental = 15;
  game.interference = makeInterference(game, {
    text: '你知道他们在看什么吗？在看你能撑到什么时候。',
    timeLeft: 2.6, maxTime: 3.2, critical: true,
  });
}
// ?mash=4 把抢麦的清除进度先点掉 4 下（截图用）；?prog=0.6 直接设进度
if (params.has('mash') && game.interference) {
  const n = Math.max(0, Number(params.get('mash') || 0));
  game.interference.prog = Math.min(0.99, n * 0.2);
}
if (params.has('prog') && game.interference) {
  game.interference.prog = Math.max(0, Math.min(0.99, Number(params.get('prog') || 0)));
}
// ?freeze=1 冻结时间（截图用）；?hit=3 在舞台中央预点 3 下看打击反馈
if (params.has('freeze')) frozen = true;
if (params.has('hit') && game.interference) {
  const n = Number(params.get('hit') || 1);
  for (let i = 0; i < n; i++) mashInterference(game, 240, 250);
}
if (params.has('scene')) {
  game.phase = 'scene';
  const n = Number(params.get('scene'));
  // ?scene=1 第一句、?scene=2 第二句
  game.sceneIndex = Number.isFinite(n) && n > 1 ? Math.min(n - 1, game.sceneLines.length - 1) : 0;
}
if (params.has('mental') && game.phase === 'live') {
  game.mental = Number(params.get('mental') || 100);
}
if (params.has('die') && game.phase === 'live') {
  game.mental = 0.05;
  for (let i = 0; i < 30; i++) update(game, 1 / 60);
}
if (params.has('after')) {
  // 按完之后再往前推一段时间（截图看 CD 变化）
  const n = Number(params.get('after') || 0);
  for (let i = 0; i < n * 60; i++) update(game, 1 / 60);
}
})();
  </script>
